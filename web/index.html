<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Draw on Maps!">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hide and Map">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hide and Map</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The __GOOGLE_MAPS_API_KEY__ placeholder is replaced at build time by the
    GitHub Actions workflow with the value of the GOOGLE_MAPS_API_KEY secret.
    For local development this file is replaced on the master branch with a
    version that fetches the key from web/secret_config.json at runtime.
  -->
  <script>
    (function() {
      var key = "__GOOGLE_MAPS_API_KEY__";
      if (key && key.indexOf("__") !== 0) {
        var s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
      } else {
        console.warn('No API key injected, Google Maps will not load.');
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
